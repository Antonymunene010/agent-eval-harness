[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Autonomous Multi-Agent Orchestration and Evaluation Framework with verifiable code execution and self-correction loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
